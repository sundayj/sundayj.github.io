#### Site Settings, Meta, and SEO
title: JLSunday
email: admin@jlsunday.com
description: >-
  Software engineering, architecture, AI-assisted development, and lessons from building real systems with C#/.NET, Python/Django, Angular, SQL, cloud infrastructure, and modern developer tooling.
tagline: Software engineering, architecture, AI, and building real systems.
baseurl: ""
url: "https://jlsunday.com"
author:
  name: Justin L. Sunday
  url: https://JLSunday.com/
default_locale: "en"
logo_light: "/assets/images/JLSunday-logo/JLSunday-no-background.png"
logo_dark: "/assets/images/JLSunday-logo/JLSunday-no-background.png"
show_contact_info: true
include_blogroll: true
feed:
  excerpt_only: true
footer:
  include_sitemap: true
  include_privacypolicy: true
  include_cookiepolicy: true
  include_terms: true
aboutme:
  include: true
  text: >-
    Hello, my name is Justin! I live in the US with my wife, amazing daughters, and our crazy canines.
    I'm extremely passionate about software development, programming, absorbing every bit of knowledge
    I can, and sharing that knowledge with anyone interested in learning.
  photo:
    use_github_avatar: false
    asset_path: "/assets/images/author/profile-photo-1352x1098.png"
    hosted_aboutme_photo:
google_analytics_key: "G-4Z30BJZ3LK"

#### Search
algolia:
  application_id: NOSLLDLG24
  index_name: posts
  search_only_api_key: 446836c037be07a8fff66ade8d708aee
  files_to_exclude:
    - pages/home.md
    - pages/about.md
    - pages/archives.md
    - pages/categories.md
    - pages/tags.md
    - pages/search.md
  settings:
    attributesToHighlight:
      - categories
      - content
      - headings
      - html
      - tags
      - title
    attributesToSnippet:
      - content:10
      - summary:10

#### CommentBox
comment_box: 5706851450617856-proj

#### Contact Form
fab_form: Aj7sjuE

### Build Settings
exclude:
  - AGENTS.md
  - .github
  - .githooks
  - scripts
  - vendor
  - README.md

markdown: kramdown
highlighter: rouge
kramdown:
  input: GFM
  syntax_highlighter_opts:
    span:
      line_numbers: false
    block:
      line_numbers: true
      start_line: 1
paginate: 5
excerpt_separator: <!-- more -->
plugins:
  - jekyll-avatar
  - jekyll-feed
  - jekyll-paginate
  - jemoji
  - jekyll-seo-tag
  - jekyll-seo
  - jekyll-remote-theme
  - jekyll-sitemap

# Temporary cross-repo validation pin for CI-011/CI-012.
remote_theme: sundayj/DevSculptor@869d15fd2c7316e2ca0bfe6d79f0d48289e7f046
