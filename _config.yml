#### Site Settings, Meta, and SEO
title: JLSunday
email: admin@jlsunday.com
description: >-
  Software engineering, architecture, AI-assisted development, and lessons from building real systems with Python/Django, Angular, C#/.NET, SQL, cloud infrastructure, and modern developer tooling.
tagline: Software engineering, architecture, AI, and building real systems.
baseurl: "" # the subpath of your site, e.g. /blog
url: "https://jlsunday.com" # the base hostname & protocol for your site, e.g. http://example.com
author:
  name: Justin L. Sunday
  url: https://JLSunday.com/
  role: Senior Software Engineer
  image: "/assets/images/author/profile-photo-1352x1098.png"
  bio: >-
    Senior software engineer building backend and frontend systems with Python/Django, Angular, C#/.NET, SQL, cloud infrastructure, and increasingly AI-assisted and agentic engineering workflows, with human engineering judgment and verification kept firmly in the loop.
  focus:
    - Software architecture
    - AI-assisted engineering
    - Python / Django
    - Angular
    - C# / .NET
    - Developer tooling
  about:
    - >-
      I work across the full software stack, from domain modeling, APIs, data and background processing to modern web interfaces and the tooling that keeps those systems maintainable. My experience spans Python/Django, Angular, C#/.NET, SQL, cloud infrastructure, and the operational concerns around shipping real software.
    - >-
      A growing part of my work is figuring out where AI and software agents genuinely improve engineering rather than simply adding novelty. I use AI extensively, but I do not accept "AI slop" as an engineering outcome. I treat models as capable collaborators whose work still needs context, constraints, review, testing, and evidence. The goal is not to generate more code faster; it is to work with AI while applying engineering judgment to make sure the resulting software, analysis, and writing are actually up to standard.
    - >-
      I am especially interested in agentic development workflows, evidence-driven automation, architecture under uncertainty, and how increasingly capable models change the responsibilities of software engineers. I use personal projects as practical proving grounds: PaySpan explores paycheck-oriented cash-flow planning and evidence-driven reconciliation; DevSculptor is the reusable Jekyll theme behind this site; and Evidence-Gated Capability Adoption is a methodology for testing promising capabilities before committing them to an architecture.
  writing:
    - Software architecture, design decisions, and engineering tradeoffs.
    - AI-assisted development and agents, with an emphasis on verification, quality, and avoiding AI slop.
    - Python/Django, Angular, C#/.NET, SQL, APIs, and developer tooling.
    - Lessons from building, debugging, modernizing, and operating real systems.

# `jekyll-seo-tag` owns OG/Twitter image tags. Pages/posts may override this
# default with front-matter `image`; otherwise branded social previews remain useful.
defaults:
  - scope:
      path: ""
    values:
      image:
        path: /assets/images/JLSunday-logo/cover2-Logo.png
        alt: "JLSunday — software engineering, architecture, and AI-assisted development"

default_locale: "en"
logo_light: "/assets/images/JLSunday-logo/JLSunday-no-background.png"
logo_dark: "/assets/images/JLSunday-logo/JLSunday-no-background.png"
show_contact_info: true # Personal Info (twitter,GitHub,email) can be seen in `\_includes\sidebar\aboutme.html`, this info only shown where show_contact_info == true
include_blogroll: true
feed:
  excerpt_only: true
footer: # Optional links for sitemap, privacy policy, cookie policy, and terms of service. These have placeholders inside that specify the author's/website's names. So, if you are in the United States, theis should be pretty much plug and play. I would definitely recommend that you look these over yourself for safety reasons. I assume no responsibility if you use these provided files. They are meant as placeholders/ templates to be edited for your specific use-case.
  include_sitemap: true
  include_privacypolicy: true
  include_cookiepolicy: true
  include_terms: true
aboutme:
  include: true
google_analytics_key: "G-4Z30BJZ3LK" # UA-57979084-1 # put YOUR key here to enable tracking! (blank to disable)

#### Search
# If you would like to include algolia search in your site, please refer to this blog post by Algolia: https://www.algolia.com/blog/engineering/instant-search-blog-documentation-jekyll-plugin/
algolia:
  application_id: NOSLLDLG24
  index_name: posts
  search_only_api_key: 446836c037be07a8fff66ade8d708aee
  files_to_exclude:
    - pages/home.md
    - pages/about.md
    - pages/archives.md
    - pages/categories.md
    - pages/tags.md
    - pages/search.md
  settings:
    attributesToHighlight:
      - categories
      - content
      - headings
      - html
      - tags
      - title
    attributesToSnippet:
      - content:10
      - description:10

