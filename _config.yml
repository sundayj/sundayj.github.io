### Build Settings
# Keep repository-only agent/editorial automation out of the generated site.
exclude:
  - AGENTS.md
  - .github
  - .githooks
  - scripts
  - vendor
  - README.md

# Kramdown Configuration
markdown: kramdown
highlighter: rouge
kramdown:
  input: GFM
  syntax_highlighter_opts:
    span:
      line_numbers: false
    block:
      line_numbers: true
      start_line: 1
paginate: 5
excerpt_separator: <!-- more -->
plugins:
  - jekyll-avatar
  - jekyll-feed
  - jekyll-paginate
  - jemoji
  - jekyll-seo-tag
  - jekyll-seo
  - jekyll-remote-theme
  - jekyll-sitemap

# Pin the theme to an immutable, integration-tested commit. Theme upgrades are explicit PRs.
remote_theme: sundayj/DevSculptor@7ddfec71560a707cecf06abe0f1e4584523ad02b
