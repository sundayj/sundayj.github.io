<head>

<meta charset="utf-8">
<meta http-equiv="X-UA-Compatible" content="IE=edge">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="keywords" content="{{ site.keywords }}">
<meta name="twitter:description" content="{%- if page.summary -%}{{ page.summary | strip_html | strip_newlines | truncate: 160 }}{%- else -%}{{ site.description }}{%- endif -%}">
<meta name="referrer" content="strict-origin-when-cross-origin">
<meta
  http-equiv="Content-Security-Policy"
  content="default-src 'self'; base-uri 'self'; object-src 'none'; frame-src 'none'; img-src 'self' data: https:; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net https://cdnjs.cloudflare.com https://www.googletagmanager.com https://www.google-analytics.com https://www.htmlcommentbox.com; style-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net https://cdnjs.cloudflare.com https://www.htmlcommentbox.com; font-src 'self' data: https://cdn.jsdelivr.net https://cdnjs.cloudflare.com; connect-src 'self' https://*.algolia.net https://*.algolianet.com https://*.algolia.io https://www.google-analytics.com https://stats.g.doubleclick.net; form-action 'self' https://fabform.io; upgrade-insecure-requests"
>

<link rel="canonical" href="{{ page.url | replace:'index.html','' |  prepend: site.url }}">
<link rel="alternate" type="application/atom+xml" title="{{ site.title }}" href="{{ "/feed.xml" | prepend: site.url }}">

{%- include head/icons.html -%}

{%- include head/stylesheets.html -%}

{%- include head/scripts.html -%}

{%- seo -%}

</head>
