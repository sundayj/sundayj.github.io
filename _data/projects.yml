- name: NPM Script Selector
  slug: npm-script-selector
  display: true
  homepage: false
  start-month: 10
  start-year: 2023
  ongoing: true
  status: Active
  role: Creator / Maintainer
  tags: [typescript, npm, package, utility, scripts, runner, dev tool]
  skills: [Node, TypeScript, JavaScript]
  website: "https://www.npmjs.com/package/npm-script-selector"
  summary: >-
    A small CLI for discovering and interactively running scripts from package.json without repeatedly opening the package file or memorizing large script sets.
  description: >-
    The NPM Script Selector is a CLI tool for discovering and running project scripts within package.json files.
    Have you ever worked on a project that contains so many scripts that you can't always remember the available options? That's what happened to me.
    I currently contribute to a project with 30+ scripts. I became tired of having to open the package file and/or
    IDE in order to find and run the needed the scripts, so I created this small CLI. Currently, you provide the path
    to the package.json file, the NPM Script Selector will then list the available scripts for you, where you can
    interactively select the one you want. It will then run the script for you within the selected project's directory.
    I plan to add more functionality in the near future. Uses figlet, commander, and inquirer.
  highlights:
    - Discovers npm scripts directly from package.json.
    - Provides an interactive selector instead of requiring developers to remember long script lists.
    - Runs the selected script in the target project's working directory.
  images:
    - title: NPM Script Selector Screenshot 20231025
      path: "/assets/images/projects/npmss/npm-script-selector-screenshot-20231025.png"
      caption: NPM Script Selector Screenshot 20231025

- name: Evidence-Gated Capability Adoption
  slug: evidence-gated-capability-adoption
  display: true
  homepage: true
  homepage_order: 3
  start-year: 2026
  ongoing: true
  status: Active
  role: Creator / Author
  tags: [AI agents, software architecture, experimentation, methodology, engineering workflow]
  skills: [Agentic AI, Software Architecture, Experiment Design, Technical Writing]
  repository: "https://github.com/sundayj/EvidenceGatedCapabilityAdoption"
  summary: >-
    An evidence-gated methodology and reusable agent skill for evaluating and adopting software capabilities through bounded, decision-oriented experiments.
  description: >-
    Evidence-Gated Capability Adoption provides a structured way to move from promising ideas to justified engineering decisions by defining hypotheses, bounded experiments, acceptance criteria, evidence, and explicit adoption gates.
  highlights:
    - Separates capability discovery from implementation commitment so new ideas are evaluated before they become architecture.
    - Uses explicit hypotheses, acceptance criteria, experiment results, and decision gates to make adoption decisions traceable.
    - Includes a reusable agent skill and is being exercised through the JLSunday and DevSculptor modernization case study.
