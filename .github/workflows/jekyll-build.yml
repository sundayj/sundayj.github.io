name: jekyll-build

on:
  pull_request:
    branches:
      - master
  push:
    branches:
      - master

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Validate changed blog files
        if: github.event_name == 'pull_request'
        env:
          BLOG_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: python3 scripts/validate_blog_posts.py

      - name: Set up Ruby
        uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1
        with:
          ruby-version: '3.2'

      - name: Install dependencies
        run: bundle install --jobs 4 --retry 3

      - name: Build site
        run: bundle exec jekyll build --trace

      - name: Validate generated SEO metadata
        run: python3 scripts/validate_generated_seo.py

      - name: Validate generated author links
        run: python3 scripts/validate_generated_author_links.py

      - name: Verify repository-only files are not published
        run: |
          test ! -e _site/AGENTS.md
          test ! -e _site/.github
          test ! -e _site/.githooks
          test ! -e _site/scripts
