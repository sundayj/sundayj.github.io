name: blog-editorial-labels

on:
  issues:
    types: [opened]
  pull_request:
    types: [opened, reopened, ready_for_review, closed]

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  label-blog-issue:
    if: >-
      github.event_name == 'issues' &&
      contains(github.event.issue.body || '', 'Publication gate')
    runs-on: ubuntu-latest
    steps:
      - name: Add blog:idea label
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          REPO: ${{ github.repository }}
        run: gh issue edit "$ISSUE_NUMBER" --repo "$REPO" --add-label "blog:idea"

  label-blog-pr:
    if: >-
      github.event_name == 'pull_request' &&
      github.event.action != 'closed' &&
      (startsWith(github.head_ref, 'blog/') ||
       contains(github.event.pull_request.body || '', 'Justin explicitly approved this post for publication'))
    runs-on: ubuntu-latest
    steps:
      - name: Add blog:review label
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: gh pr edit "$PR_NUMBER" --repo "$REPO" --add-label "blog:review"

  publish-linked-issue:
    if: >-
      github.event_name == 'pull_request' &&
      github.event.action == 'closed' &&
      github.event.pull_request.merged == true &&
      (startsWith(github.event.pull_request.head.ref, 'blog/') ||
       contains(github.event.pull_request.body || '', 'Justin explicitly approved this post for publication'))
    runs-on: ubuntu-latest
    steps:
      - name: Mark explicitly linked blog issues as published
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_BODY: ${{ github.event.pull_request.body }}
        shell: bash
        run: |
          set -euo pipefail

          issue_numbers=$(printf '%s\n' "$PR_BODY" \
            | grep -Eio '(close[sd]?|fix(e[sd])?|resolve[sd]?)[[:space:]]+#[0-9]+' \
            | grep -Eo '#[0-9]+' \
            | tr -d '#' \
            | sort -u || true)

          if [ -z "$issue_numbers" ]; then
            echo "No explicitly closing issue reference found; not guessing."
            exit 0
          fi

          for issue_number in $issue_numbers; do
            labels=$(gh issue view "$issue_number" --repo "$REPO" --json labels --jq '.labels[].name')
            if printf '%s\n' "$labels" | grep -q '^blog:'; then
              for label in blog:idea blog:researching blog:drafting blog:review blog:ready; do
                if printf '%s\n' "$labels" | grep -qx "$label"; then
                  gh issue edit "$issue_number" --repo "$REPO" --remove-label "$label"
                fi
              done
              gh issue edit "$issue_number" --repo "$REPO" --add-label "blog:published"
            else
              echo "Issue #$issue_number has no blog:* label; leaving it unchanged."
            fi
          done
