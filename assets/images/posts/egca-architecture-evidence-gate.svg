<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">Evidence-gated architecture illustration</title>
  <desc id="desc">A coding agent evaluates evidence before architectural blocks pass through a gate into a software system.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#101820"/>
      <stop offset="1" stop-color="#1f2a33"/>
    </linearGradient>
    <linearGradient id="gate" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f4d49a"/>
      <stop offset="1" stop-color="#c89b55"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000" flood-opacity=".28"/>
    </filter>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#9fb0bd" stroke-opacity=".09" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#grid)"/>

  <g opacity=".65" stroke="#6fe7dc" stroke-width="2" fill="none">
    <path d="M70 100h260m-260 40h180m-180 40h220"/>
    <circle cx="82" cy="100" r="6" fill="#6fe7dc"/>
    <circle cx="82" cy="140" r="6" fill="#6fe7dc"/>
    <circle cx="82" cy="180" r="6" fill="#6fe7dc"/>
  </g>

  <g transform="translate(90 255)" filter="url(#shadow)">
    <rect x="0" y="0" width="315" height="245" rx="26" fill="#17242d" stroke="#6fe7dc" stroke-width="3"/>
    <rect x="55" y="42" width="205" height="118" rx="28" fill="#0b1015" stroke="#dbe7ef" stroke-width="3"/>
    <circle cx="120" cy="101" r="14" fill="#6fe7dc"/>
    <circle cx="195" cy="101" r="14" fill="#6fe7dc"/>
    <path d="M116 196h82" stroke="#dbe7ef" stroke-width="12" stroke-linecap="round"/>
    <path d="M36 200H0m315 0h36" stroke="#dbe7ef" stroke-width="14" stroke-linecap="round"/>
    <text x="158" y="229" fill="#9fb0bd" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="20" text-anchor="middle">CODING AGENT</text>
  </g>

  <g transform="translate(430 160)" filter="url(#shadow)">
    <rect width="285" height="330" rx="18" fill="#f7f0df"/>
    <rect x="26" y="26" width="233" height="48" rx="8" fill="#e9dcc3"/>
    <text x="142" y="58" text-anchor="middle" fill="#17242d" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="24" font-weight="700">EVIDENCE</text>
    <g font-family="system-ui, sans-serif" font-size="22" fill="#26343e">
      <g transform="translate(35 108)"><rect width="28" height="28" rx="5" fill="#dff5e7" stroke="#39a96b" stroke-width="2"/><path d="M7 14l5 5 10-12" fill="none" stroke="#258a55" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><text x="45" y="22">Existing primitives</text></g>
      <g transform="translate(35 158)"><rect width="28" height="28" rx="5" fill="#dff5e7" stroke="#39a96b" stroke-width="2"/><path d="M7 14l5 5 10-12" fill="none" stroke="#258a55" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><text x="45" y="22">Bounded experiment</text></g>
      <g transform="translate(35 208)"><rect width="28" height="28" rx="5" fill="#dff5e7" stroke="#39a96b" stroke-width="2"/><path d="M7 14l5 5 10-12" fill="none" stroke="#258a55" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><text x="45" y="22">Rejection criteria</text></g>
      <g transform="translate(35 258)"><rect width="28" height="28" rx="5" fill="#dff5e7" stroke="#39a96b" stroke-width="2"/><path d="M7 14l5 5 10-12" fill="none" stroke="#258a55" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><text x="45" y="22">Observed result</text></g>
    </g>
  </g>

  <g transform="translate(775 92)" filter="url(#shadow)">
    <path d="M45 210V115C45 55 95 10 155 10s110 45 110 105v95h-55v-92c0-32-23-55-55-55s-55 23-55 55v92z" fill="url(#gate)" stroke="#9a7339" stroke-width="4"/>
    <rect x="18" y="198" width="295" height="56" rx="8" fill="#d9b06d" stroke="#9a7339" stroke-width="4"/>
    <text x="165" y="235" fill="#2b241b" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="26" font-weight="700" text-anchor="middle">ARCHITECTURE</text>
    <g transform="translate(72 282)" font-family="system-ui, sans-serif" text-anchor="middle">
      <rect width="186" height="58" rx="9" fill="#31414d" stroke="#6fe7dc" stroke-width="2"/><text x="93" y="36" fill="#e8f4f8" font-size="20">ADOPT</text>
      <rect y="72" width="186" height="58" rx="9" fill="#31414d" stroke="#6fe7dc" stroke-width="2"/><text x="93" y="108" fill="#e8f4f8" font-size="20">ADAPT</text>
      <rect y="144" width="186" height="58" rx="9" fill="#31414d" stroke="#8fa2af" stroke-width="2"/><text x="93" y="180" fill="#e8f4f8" font-size="20">REJECT / REPEAT</text>
    </g>
  </g>

  <path d="M716 330h58" stroke="#a8d35f" stroke-width="7" stroke-linecap="round"/>
  <path d="M757 312l22 18-22 18" fill="none" stroke="#a8d35f" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>

  <text x="70" y="65" fill="#a8d35f" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="22" font-weight="700" letter-spacing="2">EVIDENCE-GATED CAPABILITY ADOPTION</text>
  <text x="70" y="585" fill="#d8e5ec" font-family="system-ui, sans-serif" font-size="28" font-weight="650">Make the architecture earn its way in.</text>
</svg>