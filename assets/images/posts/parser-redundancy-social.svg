<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">Your Parser Shouldn't Get One Shot</title>
  <desc id="desc">A document-processing pipeline moving from native text extraction through validation, recovery, review, and a trusted result.</desc>
  <rect width="1200" height="630" fill="#121821"/>
  <text x="70" y="105" fill="#f5f7fa" font-family="Arial, Helvetica, sans-serif" font-size="52" font-weight="700">Your Parser Shouldn't Get One Shot</text>
  <text x="72" y="155" fill="#b7c3d4" font-family="Arial, Helvetica, sans-serif" font-size="27">Designing resilient document pipelines with conditional fallbacks</text>
  <g font-family="Arial, Helvetica, sans-serif" font-size="22" text-anchor="middle">
    <g fill="#1c2634" stroke="#6fa8dc" stroke-width="4">
      <rect x="75" y="275" width="170" height="82" rx="16"/>
      <rect x="300" y="275" width="150" height="82" rx="16"/>
      <rect x="505" y="275" width="150" height="82" rx="16"/>
      <rect x="710" y="275" width="150" height="82" rx="16"/>
      <rect x="915" y="275" width="150" height="82" rx="16"/>
    </g>
    <g fill="#eef3f8">
      <text x="160" y="324">Native text</text>
      <text x="375" y="324">Validate</text>
      <text x="580" y="324">Recover</text>
      <text x="785" y="324">Review</text>
      <text x="990" y="324">Result</text>
    </g>
  </g>
  <g stroke="#6fa8dc" stroke-width="5" fill="#6fa8dc">
    <line x1="245" y1="316" x2="290" y2="316"/><path d="M290 316l-13-9v18z"/>
    <line x1="450" y1="316" x2="495" y2="316"/><path d="M495 316l-13-9v18z"/>
    <line x1="655" y1="316" x2="700" y2="316"/><path d="M700 316l-13-9v18z"/>
    <line x1="860" y1="316" x2="905" y2="316"/><path d="M905 316l-13-9v18z"/>
  </g>
  <text x="600" y="420" text-anchor="middle" fill="#b7c3d4" font-family="Arial, Helvetica, sans-serif" font-size="22">OCR • layout-aware extraction • specialized parsers • bounded semantic fallback</text>
  <text x="70" y="535" fill="#f5f7fa" font-family="Arial, Helvetica, sans-serif" font-size="28">Failure should be observable, recoverable when appropriate,</text>
  <text x="70" y="574" fill="#f5f7fa" font-family="Arial, Helvetica, sans-serif" font-size="28">and honest when it isn't.</text>
  <text x="1090" y="588" text-anchor="end" fill="#6fa8dc" font-family="Arial, Helvetica, sans-serif" font-size="21">JLSunday.com</text>
</svg>
